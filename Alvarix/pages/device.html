<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Fingerprinting</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">

<h1>Device Fingerprinting</h1>

<div id="deviceResult"></div>

<button onclick="backHome()">Back Home</button>

</div>

<script>
const deviceData = {
  userAgent: navigator.userAgent,
  platform: navigator.platform,
  language: navigator.language,
  fingerprintId: "DEV-" + Math.floor(Math.random() * 100000)
};

localStorage.setItem(
  "deviceData",
  JSON.stringify(deviceData)
);

document.getElementById("deviceResult").innerHTML = `
<p>Platform: ${deviceData.platform}</p>
<p>Language: ${deviceData.language}</p>
<p>Fingerprint: ${deviceData.fingerprintId}</p>
`;

function backHome(){
  window.location.href="home.html";
}
</script>

</body>
</html>
