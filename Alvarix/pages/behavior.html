<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behavior Analytics</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">
<h1>Behavior Analytics</h1>

<div id="behaviorResult"></div>

<button onclick="backHome()">Back Home</button>
</div>

<script src="../js/api.js"></script>
<script>
loadBehavior();

async function loadBehavior(){
const transactions = await fetchTransactions();

let totalTransactions = transactions.length;

let totalAmount = transactions.reduce(
(sum, item) => sum + Number(item.amount), 0
);

let average =
totalTransactions > 0
? (totalAmount / totalTransactions).toFixed(2)
: 0;

let behaviorStatus =
average > 300000
? "High Spending Pattern"
: "Normal Spending Pattern";

document.getElementById("behaviorResult").innerHTML = `
<p>Total Transactions: ${totalTransactions}</p>
<p>Total Spending: ${formatAmount(totalAmount)}</p>
<p>Average Spending: ${formatAmount(average)}</p>
<p>Behavior Status: ${behaviorStatus}</p>
`;
}

function backHome(){
window.location.href="home.html";
}
</script>

</body>
</html>
