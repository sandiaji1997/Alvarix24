<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">

<h1>Payment Success</h1>

<div id="result"></div>

<button onclick="backHome()">Back Home</button>

</div>

<script>
const transaction =
JSON.parse(localStorage.getItem("transaction"));

let history =
JSON.parse(localStorage.getItem("transactions")) || [];

if (transaction && !history.some((item) => item.transactionId === transaction.transactionId)) {
  history.push(transaction);
}

localStorage.setItem(
 "transactions",
 JSON.stringify(history)
);

document.getElementById("result").innerHTML = `
<p>ID: ${transaction.transactionId}</p>
<p>Merchant: ${transaction.merchantName}</p>
<p>Amount: ${transaction.amount}</p>
<p>Status: ${transaction.status}</p>
<p>Fraud Score: ${transaction.fraudScore}</p>
`;

function backHome(){
 window.location.href="home.html";
}
</script>

</body>
</html>
