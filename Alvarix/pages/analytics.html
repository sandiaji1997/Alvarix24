<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">
<h1>Analytics Dashboard</h1>

<div id="analyticsResult"></div>

<button onclick="backHome()">Back Home</button>
</div>

<script src="../js/api.js"></script>
<script>
loadAnalytics();

async function loadAnalytics(){
const transactions = await fetchTransactions();

let totalTransactions = transactions.length;

let totalAmount = transactions.reduce(
(sum, item) => sum + Number(item.amount), 0
);

let averageAmount =
totalTransactions > 0
? (totalAmount / totalTransactions).toFixed(2)
: 0;

let fraudCount = transactions.filter(
item => Number(item.amount) > 500000
).length;

document.getElementById("analyticsResult").innerHTML = `
<p>Total Transactions: ${totalTransactions}</p>
<p>Total Amount: ${formatAmount(totalAmount)}</p>
<p>Average Amount: ${formatAmount(averageAmount)}</p>
<p>High Risk Transactions: ${fraudCount}</p>
`;
}

function backHome(){
window.location.href="home.html";
}
</script>

</body>
</html>
