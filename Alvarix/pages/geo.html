<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geo Location Check</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">

<h1>Geo Location Check</h1>

<div id="geoResult"></div>

<button onclick="backHome()">Back Home</button>

</div>

<script>
let locations = [
"Jakarta",
"Bandung",
"Surabaya",
"Singapore",
"Unknown VPN"
];

let selected =
locations[Math.floor(Math.random() * locations.length)];

let status =
selected === "Unknown VPN"
? "Suspicious Location"
: "Safe Location";

document.getElementById("geoResult").innerHTML = `
<p>Detected Location: ${selected}</p>
<p>Status: ${status}</p>
`;

function backHome(){
window.location.href="home.html";
}
</script>

</body>
</html>
