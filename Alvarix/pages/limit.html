<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction Limit</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">

<h1>Transaction Limit Engine</h1>

<div id="limitResult"></div>

<button onclick="backHome()">Back Home</button>

</div>

<script src="../js/api.js"></script>
<script>
loadLimit();

async function loadLimit(){
const transactions = await fetchTransactions();

let totalAmount = 0;

transactions.forEach((item) => {
totalAmount += Number(item.amount)
});

let dailyLimit = 10000000;

let status =
totalAmount > dailyLimit
? "Limit Exceeded"
: "Within Limit";

document.getElementById("limitResult").innerHTML = `
<p>Total Amount: ${formatAmount(totalAmount)}</p>
<p>Daily Limit: ${formatAmount(dailyLimit)}</p>
<p>Status: ${status}</p>
`;
}

function backHome(){
window.location.href="home.html";
}
</script>

</body>
</html>
