<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blacklist Check</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">

<h1>Blacklist Check</h1>

<div id="blacklistResult"></div>

<button onclick="backHome()">Back Home</button>

</div>

<script>
let blacklistUsers = [
"fraud_user_01",
"fraud_user_02",
"fraud_user_03"
];

let currentUser = "QCC User";

let status =
blacklistUsers.includes(currentUser)
? "Blacklisted"
: "Clean User";

document.getElementById("blacklistResult").innerHTML = `
<p>User: ${currentUser}</p>
<p>Status: ${status}</p>
`;

function backHome(){
window.location.href="home.html";
}
</script>

</body>
</html>
