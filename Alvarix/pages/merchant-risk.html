<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchant Risk</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">

<h1>Merchant Risk Engine</h1>

<div id="merchantRiskResult"></div>

<button onclick="backHome()">Back Home</button>

</div>

<script>
const transaction =
JSON.parse(localStorage.getItem("transaction"));

let riskyMerchants = [
"Casino",
"Betting",
"Gambling"
];

let merchant =
transaction.merchantName;

let status =
riskyMerchants.includes(merchant)
? "High Risk Merchant"
: "Safe Merchant";

document.getElementById("merchantRiskResult").innerHTML = `
<p>Merchant: ${merchant}</p>
<p>Status: ${status}</p>
`;

function backHome(){
window.location.href="home.html";
}
</script>

</body>
</html>
